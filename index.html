<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Matches the mobile header so the status bar blends in. The app is dark-only. -->
    <meta name="theme-color" content="#141414" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" keeps the app below the status bar; "black-translucent" makes iOS home-screen apps size the page wrongly and leave a gap at the bottom -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
